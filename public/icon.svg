<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="motiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="108" fill="url(#motiGrad)" />
  
  <!-- Outer Ring Accent -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.3" />
  
  <!-- Shop Canopy / Awning -->
  <g filter="url(#shadow)">
    <!-- Awning back -->
    <path d="M 120 180 L 392 180 L 372 230 L 140 230 Z" fill="#065f46" />
    <!-- Awning stripes -->
    <path d="M 120 180 L 160 180 L 180 230 L 140 230 Z" fill="#10b981" />
    <path d="M 160 180 L 200 180 L 220 230 L 180 230 Z" fill="#ffffff" />
    <path d="M 200 180 L 240 180 L 260 230 L 220 230 Z" fill="#10b981" />
    <path d="M 240 180 L 280 180 L 300 230 L 260 230 Z" fill="#ffffff" />
    <path d="M 280 180 L 320 180 L 340 230 L 300 230 Z" fill="#10b981" />
    <path d="M 320 180 L 360 180 L 380 230 L 340 230 Z" fill="#ffffff" />
    <path d="M 360 180 L 392 180 L 372 230 L 380 230 Z" fill="#10b981" />
    
    <!-- Scallop valance -->
    <path d="M 140 230 Q 160 245 180 230 Q 200 245 220 230 Q 240 245 260 230 Q 280 245 300 230 Q 320 245 340 230 Q 360 245 372 230" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
  </g>
  
  <!-- Shop Body / Smart Register -->
  <rect x="148" y="240" width="216" height="150" rx="16" fill="#ffffff" filter="url(#shadow)" />
  <rect x="164" y="254" width="184" height="60" rx="8" fill="#0f172a" />
  
  <!-- Digital Rupee Indicator on screen -->
  <text x="180" y="295" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="28" fill="#10b981">₹</text>
  <text x="210" y="295" font-family="'Plus Jakarta Sans', monospace" font-weight="700" font-size="24" fill="#38bdf8">MOTi</text>
  
  <!-- Keypad & Barcode Drawer -->
  <circle cx="180" cy="345" r="8" fill="#e2e8f0" />
  <circle cx="210" cy="345" r="8" fill="#e2e8f0" />
  <circle cx="240" cy="345" r="8" fill="#e2e8f0" />
  
  <!-- Smart Badge / Rupee Coin Accent -->
  <g transform="translate(315, 330)" filter="url(#shadow)">
    <circle cx="18" cy="18" r="26" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" />
    <text x="18" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="26" fill="#ffffff">₹</text>
  </g>
  
  <!-- MOTI TECHNOLOGIES brand wordmark at base -->
  <text x="256" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="34" letter-spacing="3" fill="#ffffff">MOTi DUKAAN</text>
  <text x="256" y="475" text-anchor="middle" font-family="'Mukta', sans-serif" font-weight="600" font-size="19" fill="#a7f3d0">तुमच्या दुकानाचा स्मार्ट साथीदार</text>
</svg>
